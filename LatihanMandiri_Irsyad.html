<!doctype html>
<Html lang="en">
<head>
     <title> Irsyad Sasmoyo Pramudito </title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
     <header> Irsyad Sasmoyo Pramudito </header>
     <nav>
          <a href="#tentang"> Tentang </a>
          <a href="#jadwal"> Jadwal </a>
          <a href="#kontak"> Kontak </a>
     </nav>
<main>
     <section id="tentang">
     <img src="Bucky.png" alt="mykisah">
     <h2> Tentang Saya </h2>
     <p> Mahasiswa RPL yang suka batu </p>
     <p> Hobi Gweh: </p>
     <ul>
          <li> Music </li>
          <li> Animating </li>
          <li> Modeling </li>
          <li> Games </li>
     </ul>
     </section>

     <Section id="jadwal">
          <h2> Jadwal Kuliah </h2>
          <table border="1">
          <thead>
               <tr>
                    <th> Hari </th>
                    <th> Mata Kuliah </th>
                    <th> Jam </th>
               </tr>
          </thead>
          <tbody>
               <tr>
                    <td> Senin </td>
                    <td> Pemograman Web </td>
                    <td> 08:00 </td>
               </tr>
          </tbody>
          </table>
     </section>

     <section id="kontak">
     <div>
          <label for="nama"> Nama: </label><br>
          <input type="text" id="nama" name="nama">
     </div>
     <div>
          <label for="email"> Email: </label><br>
          <input type="email" id="email" name="email">
     </div>
     <div>
          <label for="pesan"> Pesan: </label><br>
          <textarea id="pesan" name="pesan" rows="5" cols="30"> </textarea>
     </div>
     <div>
          <button type="submit"> Send </button>
     </div>
     </section>
</main>
<footer>
     <p> 2026 Cihuy </p>
     <a href="https://github.com/SushiDotRoll"> Github Gweh </a>
</footer>
</body>
</html>
